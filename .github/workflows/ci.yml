name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 纯标准库部分：划分与协议模块不依赖 torch/flwr，任何 Python ≥3.11 都能跑。
  # 这是全仓库唯一能在 CI 里低成本执行的部分，所以测试只覆盖这里。
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装 pytest
        run: python -m pip install -U pytest
      - name: 运行测试
        run: python -m pytest tests -v
      - name: 语法检查（脚本与 src 全部编译）
        run: python -m compileall -q scripts src

  # matr 模块：只依赖 numpy + h5py + pandas（都比 torch 便宜得多），所以它进默认
  # CI。测试用合成 HDF5 + 本地 Range 服务器，全程不联网——数据集的 7.7 GiB 不该
  # 成为「能不能跑测试」的前提。
  matr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 numpy / h5py / pandas / pyarrow
        run: python -m pip install -U pip numpy h5py pandas pyarrow pytest
      - name: 运行 matr 与特征表测试
        run: python -m pytest tests/test_matr.py tests/test_features.py tests/test_transport.py -v
      - name: 清单脚本的纯逻辑（选择与去重）不联网即可跑
        run: |
          python - <<'PY'
          import copy, sys
          sys.path.insert(0, "scripts")
          from build_manifest import (
              CONTINUATION_ADD_LEN,
              CONTINUATIONS,
              check_continuation_evidence,
              select_cells,
          )

          # 用真实 policy 字符串：延续段的字符串缺前缀是数据里的事实。
          origins = {
              "b1c0": "3.6C(80%)-3.6C",
              "b1c1": "3.6C(80%)-3.6C",
              "b1c2": "3.6C(80%)-3.6C",
              "b1c3": "4C(80%)-4C",
              "b1c4": "4C(80%)-4C",
              "b1c5": "4.4C(80%)-4.4C",  # 干扰项：后缀是 80%)-4.4C，接不上 80%)-4C
          }
          conts = {
              "b2c7": "80%)-3.6C",
              "b2c8": "80%)-3.6C",
              "b2c9": "80%)-3.6C",
              "b2c15": "80%)-4C",
              "b2c16": "80%)-4C",
          }
          manifest = {
              "batches": [
                  {"batch_no": 1, "cells_meta_complete": True, "cells": [
                      {"cell_id": cid, "index": int(cid.split("c")[1]),
                       "policy": pol, "n_cycles": 1000}
                      for cid, pol in origins.items()]},
                  {"batch_no": 2, "cells_meta_complete": True, "cells": [
                      {"cell_id": cid, "index": int(cid.split("c")[1]),
                       "policy": pol, "n_cycles": CONTINUATION_ADD_LEN[cid] + 1}
                      for cid, pol in conts.items()]},
              ],
              "totals": {"n_cells": 11, "plan_n_cells": 135, "matches_plan": False},
          }
          assert set(conts) == set(CONTINUATIONS), "CI 里的映射和代码里的不一致"
          assert check_continuation_evidence(manifest) == [], "四条证据应当全过"

          picked = select_cells(manifest)
          ids = [c["cell_id"] for e in picked["batches"] for c in e["cells"]]
          assert "b2c7" not in ids and len(ids) == 6, ids
          assert picked["totals"]["n_cells_selected"] == 6

          # 负控 1：policy 接不上必须报出来，否则删的是正常数据
          bad = copy.deepcopy(manifest)
          for cell in bad["batches"][1]["cells"]:
              if cell["cell_id"] == "b2c15":
                  cell["policy"] = "80%)-4.4C"
          assert check_continuation_evidence(bad), "policy 接不上却没报错"

          # 负控 2：段长对不上 add_len，说明「谁接谁」配错了
          bad = copy.deepcopy(manifest)
          for cell in bad["batches"][1]["cells"]:
              if cell["cell_id"] == "b2c7":
                  cell["n_cycles"] = 980
          assert check_continuation_evidence(bad), "段长不符却没报错"

          # 负控 3：没有元信息时必须返回 None，不能假装通过
          thin = copy.deepcopy(manifest)
          thin["batches"][1]["cells_meta_complete"] = False
          assert check_continuation_evidence(thin) is None
          print("selection logic OK")
          PY

  # 实验协议校验器：两份真实配置必须零 ERROR。
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: mvp.toml 必须零 ERROR
        run: python scripts/check_protocol.py --config configs/mvp.toml
      - name: full.toml 必须零 ERROR
        run: python scripts/check_protocol.py --config configs/full.toml

      # 负控：检查器必须能报错。一个永远打印 PASS 的检查器比没有检查器更糟，
      # 因为它会让「已校验」这句话变成假的。
      # 夹具由真实配置改一行得到，因此不会与 schema 漂移。
      - name: 负控 1：划分原子改成 cycle 必须失败
        run: |
          sed 's/partition_atom = "cell"/partition_atom = "cycle"/' configs/mvp.toml > /tmp/atom.toml
          if python scripts/check_protocol.py --config /tmp/atom.toml; then
            echo "::error::检查器对错误的划分原子放行了"; exit 1
          fi
          python scripts/check_protocol.py --config /tmp/atom.toml | grep -q "C-ATOM" || {
            echo "::error::失败码不是 C-ATOM"; exit 1; }
      - name: 负控 2：删掉 centralized 基线必须失败
        run: |
          sed 's/"centralized", //' configs/mvp.toml > /tmp/nocentral.toml
          if python scripts/check_protocol.py --config /tmp/nocentral.toml; then
            echo "::error::检查器对缺少 centralized 放行了"; exit 1
          fi
          python scripts/check_protocol.py --config /tmp/nocentral.toml | grep -q "C-STRATEGY" || {
            echo "::error::失败码不是 C-STRATEGY"; exit 1; }
      - name: 负控 3：只给 2 个 seed 必须失败
        run: |
          sed 's/values = \[0, 1, 2\]/values = [0, 1]/' configs/mvp.toml > /tmp/seeds.toml
          if python scripts/check_protocol.py --config /tmp/seeds.toml; then
            echo "::error::检查器对 2 个 seed 放行了"; exit 1
          fi
          python scripts/check_protocol.py --config /tmp/seeds.toml | grep -q "C-SEEDS" || {
            echo "::error::失败码不是 C-SEEDS"; exit 1; }

  # 划分泄漏检测：生成器必须全 PASS，且必须能抓出被污染的产物。
  partition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: mvp 划分必须全 PASS
        run: python scripts/check_partition.py --config configs/mvp.toml
      - name: full 划分必须全 PASS
        run: python scripts/check_partition.py --config configs/full.toml
      - name: 生成的划分可被再次对账
        run: |
          python scripts/check_partition.py --config configs/mvp.toml \
            --emit /tmp/clean.json --emit-k 5 --emit-scheme iid
          python scripts/check_partition.py --config configs/mvp.toml \
            --partition-json /tmp/clean.json
      - name: 负控：把一颗电池塞进第二个客户端必须报 P-LEAK
        run: |
          cp /tmp/clean.json /tmp/leaked.json
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/leaked.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          ids = sorted(d["partition"])
          d["partition"][ids[1]].append(d["partition"][ids[0]][0])
          p.write_text(json.dumps(d, ensure_ascii=False), encoding="utf-8")
          print("已注入泄漏：", d["partition"][ids[0]][0])
          PY
          python scripts/check_partition.py --config configs/mvp.toml \
            --partition-json /tmp/leaked.json | tee /tmp/leaked.log
          if ! grep -q "P-LEAK" /tmp/leaked.log; then
            echo "::error::失败码不是 P-LEAK"; exit 1
          fi
      - name: 负控：把测试电池塞进客户端必须报 P-TEST
        run: |
          cp /tmp/clean.json /tmp/testleak.json
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/testleak.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          ids = sorted(d["partition"])
          d["partition"][ids[0]].append(d["test_cells"][0])
          p.write_text(json.dumps(d, ensure_ascii=False), encoding="utf-8")
          PY
          python scripts/check_partition.py --config configs/mvp.toml \
            --partition-json /tmp/testleak.json | tee /tmp/testleak.log
          if ! grep -q "P-TEST" /tmp/testleak.log; then
            echo "::error::失败码不是 P-TEST"; exit 1
          fi

  # 反造假闸门：§10.2 的结果表必须能被 results/*.json 重新算出来。
  #
  # 这条闸门的第一版是「结果列必须全是占位符 —」，那在**还没有实验结果**
  # 的时候是对的：它拦的是「先写结论再补实验」。第一批结果落地后那条断言
  # 只剩一个作用——拦住所有真实结果，于是它红了（2026-10-24 的 run
  # 40060578763）。但直接删掉它等于把闸门拆了。
  #
  # 所以改成更强的版本：文档里的表与 `summarize_results.py` 从原始 JSON
  # 重新算出来的表**逐字比对**。旧版只能拦住"提前填数"，拦不住"填错的数"；
  # 新版连一个数字被手改都会红。
  no-fabricated-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: §10.2 结果表必须与 results/ 重新算出的结果逐字一致
        run: python scripts/summarize_results.py --check-plan docs/plan.md

      # 负控：检查器必须有负控，否则它可能只是个永远打印 OK 的摆设。
      # 改掉生成区里的第一个数字，断言闸门报错（退出码 3）。
      - name: 负控：改掉表里一个数，闸门必须报错
        run: |
          cp docs/plan.md /tmp/plan.bak
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("docs/plan.md")
          t = p.read_text(encoding="utf-8")
          b = t.index("<!-- BEGIN GENERATED: results-table -->")
          e = t.index("<!-- END GENERATED: results-table -->")
          block = t[b:e]
          m = re.search(r"\d\.\d{5}", block)
          if not m:
              raise SystemExit("::error::生成区里找不到可扰动的数字，负控失效")
          print(f"扰动 {m.group(0)} → 0.00999")
          p.write_text(t[:b] + block[:m.start()] + "0.00999" + block[m.end():] + t[e:],
                       encoding="utf-8")
          PY
          set +e
          python scripts/summarize_results.py --check-plan docs/plan.md > /tmp/nc.log 2>&1
          code=$?
          set -e
          cp /tmp/plan.bak docs/plan.md
          if [ "$code" -eq 0 ]; then
            echo "::error::负控失败：手改了数字，闸门却通过了"
            exit 1
          fi
          echo "OK 负控生效（退出码 $code）"
          # 还原后必须重新通过，证明失败不是别的原因造成的
          python scripts/summarize_results.py --check-plan docs/plan.md

  # data / model / app 依赖 torch + flwr。它们**默认不在 CI 里跑**：
  # 上面的 tests job 用纯标准库就能验证检查器，不需要为了跑检查去解析
  # 几百 MB 的依赖树。这个 job 是手动触发的（workflow_dispatch），
  # 改了训练代码时点一下即可——它的存在是让"有测试"这句话保持为真，
  # 而不是让每次 push 都等 10 分钟装 torch。
  heavy-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装训练栈（flwr 1.41.0 / torch 2.10.0）
        run: |
          python -m pip install -U pip
          # pyarrow 必须显式列：冒烟脚本要写 features.parquet，而 pandas
          # 的 parquet 引擎不是 pandas 的硬依赖。少了它报的是
          # "Unable to find a usable engine"，看不出是缺 pyarrow。
          python -m pip install "flwr[simulation]==1.41.0" "torch==2.10.0" \
              "numpy>=1.26" "pandas>=2.1" "scikit-learn>=1.4" pyarrow pytest
      - name: 运行依赖 torch/flwr 的测试
        run: |
          python -m pytest tests/test_model.py tests/test_data.py \
              tests/test_app.py tests/test_train.py -v
      # 注意：这个 job **没有** `pip install -e .`，所以 `flsoh` 不在
      # site-packages 里。pytest 能跑是因为 `tests/conftest.py` 把 src/
      # 注入了 sys.path；裸 `python -c` 没有那层注入，会 ModuleNotFoundError。
      # 这个坑藏了很久——heavy-tests 是手动触发的，第一次真跑才暴露。
      - name: App 三层可导入
        env:
          PYTHONPATH: src
        run: |
          python -c "import flsoh.app.client_app, flsoh.app.server_app; print('apps import OK')"
      # M1 DOD ①：`flwr` 的官方仿真运行时必须真的跑通一次。这条只能在
      # Linux runner 上验证——Windows + 中文主机名会让 raylet 启动即崩
      # （protobuf 拒绝非 UTF-8 主机名），本地无法替代。
      - name: flwr 官方仿真冒烟（M1 DOD ①）
        run: python scripts/ci_smoke_flwr.py

      # 冒烟用 FLSOH_RUN_CONFIG 覆盖文件传超参，不碰 pyproject。
      # 这一步是兜底：万一以后有人又改成「临时改配置再改回来」，这里会红。
      - name: 冒烟不许留下被改写的仓库状态
        run: |
          if ! git diff --exit-code; then
            echo "::error::冒烟跑完后工作区有改动，测试不该改写被追踪的文件"
            exit 1
          fi

      # 划分的标签偏斜是可算的，不能靠人写「这个划分够异质」。
      # 2026-10-24 实测 Dirichlet α=0.5 在 N=23 时的偏斜（12.2%）比 IID
      # （17.3%）还小——不量的话「Non-IID 没掉点」会被读成算法免疫，
      # 而真相是处理没施加。
      #
      # 注意：真实特征表 `data/mit-stanford/features.parquet` 被 gitignore，
      # CI 里没有，所以这里**不能重算**，只能核对提交进来的
      # `results/heterogeneity.json` 是否覆盖了所有 Non-IID 划分。
      # 重算的命令写在 README，跑新数据时必须重跑一次。
      - name: heterogeneity.json 必须覆盖所有 Non-IID 划分
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          hetero = json.loads(
              Path("results/heterogeneity.json").read_text(encoding="utf-8")
          )
          covered = set(hetero.get("partitions") or {})

          # results/ 里每个 run 用的划分
          used = set()
          for p in sorted(Path("results").glob("*.json")):
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              src = d.get("partition_json")
              if src:
                  used.add(Path(str(src)).name)

          missing = used - covered
          if missing:
              sys.exit(
                  "::error::这些划分产物没有标签偏斜记录，H2 的 manipulation "
                  "check 会失效：\n  " + "\n  ".join(sorted(missing))
                  + "\n重跑：python scripts/measure_heterogeneity.py "
                  "--features data/mit-stanford/features.parquet "
                  "--out results/heterogeneity.json <各划分>"
              )
          print(f"OK heterogeneity.json 覆盖 {len(covered)} 份划分，"
                f"results/ 用到的 {len(used)} 份全部有记录")
          PY

      # 判 H2 的闸门：任何 Non-IID 划分的偏斜不高于 IID 基线时，判定必须
      # 输出「处理未施加」而不是「推翻」。这条防的是「拿一个没通电的电路
      # 去证明断路器好用」。
      #
      # 两个失败文案都要拦：「缺 heterogeneity.json」（整个文件没有）和
      # 「找不到该 N 的划分」（文件在、但没有这一档 k 的记录——M3 的 k 扫描
      # 新增四档 N，只重跑一部分测量就会落进这个洞）。少拦任何一个，
      # manipulation check 都会在被跳过的情况下看起来依然绿。
      - name: H2 判定前必须查偏斜
        run: |
          python scripts/summarize_results.py --judge \
              --hetero results/heterogeneity.json 2>&1 | tee /tmp/judge.log
          if grep -qE "缺 heterogeneity.json|找不到该 N 的划分" /tmp/judge.log; then
            echo "::error::判定拿不到偏斜数据，manipulation check 失效"
            exit 1
          fi
          echo "OK manipulation check 有数据可用"
