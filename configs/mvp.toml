# MVP 实验矩阵 —— 对应 docs/plan.md §9.2
#
# 校验：python3 scripts/check_protocol.py --config configs/mvp.toml
# 划分：python3 scripts/check_partition.py --config configs/mvp.toml
#
# 两条命令都在训练之前跑。协议错了，后面所有 run 的 JSON 都不能用。

[meta]
name = "mvp"
plan_version = "2.0"
description = "FedAvg/FedProx × IID/Non-IID，3 seeds，出轮数-精度曲线与表 1"
# 声明「这份配置就是 pyproject.toml 里 [tool.flwr.app.config] 对应的那一份」。
# 只有声明了，check_protocol 才会核对两边的轮数/epoch/lr/batch 是否一致。
# 为什么需要这个开关：pyproject 只能承载一组值，而 configs/ 下可以有多份
# 矩阵（full.toml 是论文全矩阵，官方运行时不会用它）。不声明就核对，
# 会把「本来就不该一致的两份」判成错误。
app_config = true

[data]
dataset = "mit-stanford"
# 实测值，不是论文口径。三个原始文件共 140 颗（46 + 48 + 46），其中批次 2 有
# 5 颗是批次 1 的延续（同一物理通道，channel_id 逐位相同，见
# scripts/check_continuations.py），去重后 135 颗。
# 论文的 124 是另一件事：它为「预测 cycle life」剔掉了没跑到 80% 容量的电池；
# 本项目的标签是逐循环 SOH，那些电池在循环 5–100 区间内是正常数据。
n_cells = 135
# 划分原子必须是 "cell"。改成 cycle 会让同一颗电池的相邻循环跨客户端，
# 时间序列截断使泛化虚高（§6.2 规则 1）。check_protocol.py 会直接拒。
partition_atom = "cell"

[partitions]
# 全局测试集按"整颗电池"留出，与所有客户端数据不相交（§6.2 规则 2）。
# 135 - 20 = 115 颗进客户端，115 / 5 = 23 个客户端。
test_cells = 20
# 留出哪 24 颗只由这个 seed 决定，与训练 seed 无关：
# 否则换一个训练 seed 就换一个测试集，曲线之间不可比。
split_seed = 0
cells_per_client = [5]
# 不整除时把余数摊给前几个客户端（spread），不丢弃电池；
# "drop" 会直接扔掉尾部电池，只适合临时调试。
remainder = "spread"
schemes = ["iid", "dirichlet"]
# 实测（check_partition.py）：N=23、α=0.5 时最大的客户端独占 21 颗，而 8 个
# 客户端各只有 1 颗。Dirichlet 分的是电池不是样本，客户端一多、α 一小就会
# 退化成"一人独占"。这是要写进报告的现象，不是 bug——但它意味着这个划分下
# 「量偏斜」与「域偏移」已经混在一起，不能声称只考察了其中一种（§5.1）。
#
# 更要紧的一条（2026-10-24 实测，§11.3.4）：Dirichlet 只造成**数量偏斜**
# （样本量基尼 0.519），它的**标签偏斜只有 12.2%，低于 IID 的 17.3%**——
# 因为把 21 颗电池合成一个客户端会把电池间的 SOH 差异平均掉。所以
# `schemes` 里不放 sohrank：它不在常规检查矩阵里，要用时单独
# `--emit-scheme sohrank --cell-soh-json data/mit-stanford/cell_soh.json`
# 生成，并且必须先跑 measure_heterogeneity.py 量出偏斜。
dirichlet_alpha = [0.5]

[strategies]
# 必须含 centralized：没有 C0 就不知道联邦掉的是不是"本来就该掉"（§9.4）。
include = ["centralized", "fedavg", "fedprox"]
proximal_mu = [0.0, 0.01, 0.1]

[train]
num_rounds = 100
# 每轮本地 epoch。**这个数不是自由超参，它决定总训练量。**
#
# 每客户端只有 5 颗电池 × 16 训练循环 = 80 行，batch_size=64 时每 epoch
# 只有 2 个 batch。所以 local_epochs=2 的 100 轮总共只有 400 步更新，
# 而 C0 中心化基线是 300 ep × 36 batch ≈ 10800 步——差 27 倍，模型根本没训开。
#
# 实测（IID、seed=0、100 轮、Adam、同一划分）：
#
# ============== ========== ================
# local_epochs   最终 MAE   相对 C0(0.0016)
# ============== ========== ================
# 2              0.02220    +1290%
# 3              0.01265    +691%
# 4              0.00483    +202%
# 10             0.00131    −18%
# 20             0.00120    −25%
# ============== ========== ================
#
# 取 10 的理由：这是第一个追平 C0 的档位，再往上收益递减（20 只多 8%）。
# **代价要如实写进报告**：追平需要约 1000 个本地 epoch，是 C0 的 3.3 倍。
# 原因是每轮聚合后 Adam 的动量状态归零（FedAvg 只聚合参数，不聚合优化器
# 状态），轮数越多"预热损失"累积越多。这不是 bug，是联邦的真实成本。
local_epochs = 10
# Adam 不是随手换的：plan 早期写的是 SGD，但那时没有真实数据。拿到 MIT 特征表后
# 实测同一划分、同样中心化、100 ep：SGD 测试 MAE 0.0239、Adam 0.00415（5.8 倍）。
# 联邦场景下差距更大：le=10 时 SGD lr=0.01 得 0.02845，Adam 得 0.00131（22 倍）。
optimizer = "adam"
learning_rate = 0.001
batch_size = 64
fraction_fit = 1.0
# 中心化基线（C0/C1）的 epoch 数，与 num_rounds 无关——基线是单模型训练。
# 实测 100 ep 欠拟合(0.00415)、300 ep 甜点(0.00155)、500 ep 过拟合(0.00406)。
baseline_epochs = 300

[seeds]
values = [0, 1, 2]
min_required = 3

[privacy]
# MVP 只做 L1（联邦本身），不开 DP。完整版见 full.toml。
enabled = false
noise_multiplier = []
max_grad_norm = 1.0
target_delta = 1e-5

[acceptance]
# §11.3 的判据阈值。全部是相对量，不是绝对 MAE。
iid_degradation_max = 0.05
non_iid_degradation_min = 0.10
fedprox_improvement_min = 0.05
seed_cv_max = 0.10
dp_degradation_max = 0.30
dp_epsilon_max = 8.0
